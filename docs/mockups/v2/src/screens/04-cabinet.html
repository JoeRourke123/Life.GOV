<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"></head>
<body>
<div class="phone" id="shot">
  <div class="statusbar"><div>9:41</div><div class="icons"><svg width="17" height="11" viewBox="0 0 17 11"><path d="M1 10 L3 10 M4.5 8 L6.5 8 M8 6 L10 6 M11.5 4 L13.5 4 M15 2 L16 2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg><svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 10 L1.5 3.5 C5 .8 11 .8 14.5 3.5 Z" fill="#fff"/></svg><div class="batt"></div></div></div>

  <div class="app">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-top:6px;">
      <div>
        <div class="kicker">The Cabinet</div>
        <div class="h1" style="margin-top:4px;">Seven ministers</div>
      </div>
      <div style="text-align:right; margin-top:14px;">
        <div style="font-size:11px; color:var(--muted);">Administration bonus</div>
        <div class="gold" style="font-weight:800; font-size:15px;">+12% all rewards</div>
      </div>
    </div>

    <!-- cabinet table: horseshoe of seats -->
    <svg id="table" width="354" height="230" viewBox="0 0 354 230" style="display:block; margin:6px auto 0;"></svg>

    <div id="minister" class="card paper" style="padding:12px 13px; margin-top:2px;"></div>
  </div>

  <div class="tabbar">
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M4 21 V8 L12 3 L20 8 V21"/><path d="M9 21 V13 H15 V21"/></svg><div class="tick"></div><span>No. 10</span></div>
    <div class="tab"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8 H15 M9 12 H15 M9 16 H13"/></svg><div class="tick"></div><span>Order Paper</span></div>
    <div class="tab on"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2.5 20 C2.5 15.5 6 14 8 14 C10 14 13.5 15.5 13.5 20 M10.5 20 C10.5 15.5 14 14 16 14 C18 14 21.5 15.5 21.5 20"/></svg><div class="tick"></div><span>Cabinet</span></div>
    <div class="tab"><svg viewBox="0 0 24 24"><path d="M4 5 H20 V19 H4 Z"/><path d="M4 9 H20 M9 9 V19"/></svg><div class="tick"></div><span>Gazette</span></div>
    <div class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 8 H13.5 A2.5 2.5 0 0 1 13.5 13 H9 M11 13 H14.5 A2.5 2.5 0 0 1 14.5 18 H9 M9 8 V18 M8.2 10.5 H12 M8.2 15.5 H12" stroke-width="1.4"/></svg><div class="tick"></div><span>Treasury</span></div>
  </div>
</div>

<script>
const ministers = [
  { post: 'Education Secretary', area: 'Learning & skills', lv: 6, bonus: 12, status: 'Considered competent.', bills: 2, x: 177, y: 46 },
  { post: 'Chancellor of the Exchequer', area: 'Money & budgeting', lv: 5, bonus: 10, status: 'Balanced the books.', bills: 1, x: 72, y: 84 },
  { post: 'Foreign Secretary', area: 'Social & travel', lv: 2, bonus: 4, status: 'Frequently abroad.', bills: 0, x: 282, y: 84 },
  { post: 'Home Secretary', area: 'Home & life admin', lv: 3, bonus: 6, status: 'Papers in order.', bills: 1, x: 40, y: 148 },
  { post: 'Health Secretary', area: 'Health, sleep, fitness', lv: 4, bonus: 8, status: 'Prescribed moderation.', bills: 1, x: 314, y: 148 },
  { post: 'Culture Secretary', area: 'Hobbies & arts', lv: 6, bonus: 12, status: 'Read 12 books this year.', bills: 2, x: 96, y: 196 },
  { post: 'Business Secretary', area: 'Career & projects', lv: 7, bonus: 14, status: 'Ships on schedule.', bills: 3, x: 258, y: 196 },
];
const active = 6;
document.getElementById('table').innerHTML = `
  <path d="M60 60 C120 18 234 18 294 60 C330 88 344 130 344 168 C344 196 320 210 296 200 C262 186 240 176 177 176 C114 176 92 186 58 200 C34 210 10 196 10 168 C10 130 24 88 60 60 Z"
    fill="#1b1f26" stroke="#2d333e" stroke-width="1.5"/>
  <path d="M74 66 C126 30 228 30 280 66" fill="none" stroke="#2d333e" stroke-width="1"/>
  <text x="177" y="118" text-anchor="middle" font-family="STIX Two Text" font-size="13" font-style="italic" fill="#5d6472">The Cabinet Table</text>
  <text x="177" y="134" text-anchor="middle" font-family="IBM Plex Mono" font-size="8.5" letter-spacing="2" fill="#3c4350">CUM VITA, NON CONTRA VITAM</text>
` + ministers.map((m, i) => {
  const on = i === active;
  const c = on ? '#d9a93c' : '#3c4350';
  const fill = on ? 'rgba(217,169,60,.18)' : '#262b35';
  const r = on ? 17 : 15;
  return `<g>
    <circle cx="${m.x}" cy="${m.y}" r="${r + 4}" fill="none" stroke="${on ? 'rgba(217,169,60,.35)' : 'transparent'}" stroke-width="1"/>
    <circle cx="${m.x}" cy="${m.y}" r="${r}" fill="${fill}" stroke="${c}" stroke-width="1.5"/>
    <text x="${m.x}" y="${m.y + 4}" text-anchor="middle" font-family="STIX Two Text" font-weight="700" font-size="12.5" fill="${on ? '#eec25f' : '#939aa7'}">${m.post[0]}</text>
    <rect x="${m.x + 8}" y="${m.y + 8}" width="21" height="13" rx="6.5" fill="#121419" stroke="${on ? '#d9a93c' : '#2d333e'}" stroke-width="1"/>
    <text x="${m.x + 18.5}" y="${m.y + 17.5}" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="8" fill="${on ? '#eec25f' : '#8f96a3'}">${m.lv}</text>
  </g>`;
}).join('');

const m = ministers[active];
document.getElementById('minister').innerHTML = `
  <div style="display:flex; align-items:center; gap:11px;">
    <div style="width:46px; height:46px; border-radius:50%; background:rgba(217,169,60,.18); border:1.5px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; font-size:19px; color:var(--gold-bright);">${m.post[0]}</div>
    <div style="flex:1;">
      <div style="font-family:var(--serif); font-weight:700; font-size:16.5px;">${m.post}</div>
      <div style="font-size:12px; color:var(--muted); margin-top:2px;">${m.area}</div>
    </div>
    <div style="text-align:right;">
      <div style="font-family:var(--mono); font-weight:600; font-size:12px; color:var(--gold);">Lv ${m.lv}</div>
      <div class="green" style="font-size:11.5px; font-weight:700; margin-top:1px;">+${m.bonus}% rewards</div>
    </div>
  </div>
  <div style="margin-top:10px; display:flex; align-items:center; justify-content:space-between;">
    <div style="font-size:12.5px; font-style:italic; font-family:var(--serif); color:var(--muted);">"${m.status}"</div>
    <div style="font-size:11.5px; color:var(--faint);">${m.bills} bill${m.bills === 1 ? '' : 's'} in committee</div>
  </div>
  <div style="margin-top:9px; display:flex; gap:8px;">
    <div class="btn btn-outline btn-sm" style="flex:1;">View ministry</div>
    <div class="btn btn-red btn-sm" style="flex:1;">Table a bill</div>
  </div>`;
</script>
</body></html>
